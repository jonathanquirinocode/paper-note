<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Note</title>

    <link rel="stylesheet" href="./css/style.css"/>
    <script src="./js/script.js" defer></script>
    <!-- <script src="/js/changing-color.js" defer></script> -->

    <!-- Bootstrap icons -->
    <link rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Fontes -->
    <link rel="stylesheet" href="https://use.typekit.net/fqb3uvf.css">

</head>
<body>
    <header>
        <h1>PaperNote</h1>
        <div id="search-container">
            <div  class="mobile-ocult">
                <i class="bi bi-search"></i>
            </div>
            <input type="text" id="search-input" placeholder="O que você procura? 😉">
            <div class="mobile-search-btn">
                <i id="search-btn-mobile" class="bi bi-search"></i>
            </div>
    </div>
    <button id="exports-notes">
        Exportar CSV <i class="bi bi-download"></i>
    </button>
    </header>
    <div id="add-note-container">
        <input type="text" id="add-note-input" placeholder="Crie uma nova notinha! 📒">
        <button class="add-note-btn">
            <i class="bi bi-plus-lg"></i>
        </button>
    </div>
    <div id="hiding-place"></div>
    <div id="create-note-mobile-btn">
        <div class="new-note-btn hide">
            <textarea placeholder="Adicione sua anotação..."></textarea>
            <i class="bi bi-pin-fill"></i>
            <i class="bi bi-x-lg"></i>
            <i class="bi bi-file-earmark-plus"></i>
            <i class="bi bi-palette"></i>
            <ul class="colors-options hide">
                <i class="bi bi-palette-fill"></i>
                <li class="yellow"><span class="color"></span></li>
                <li class="green"><span class="color"></span></li>
                <li class="pink"><span class="color"></span></li>
                <li class="red"><span class="color"></span></li>
                <li class="cyan"><span class="color"></span></li>
                <li class="orange"><span class="color"></span></li>
            </ul>
        </div>
    </div>
    <div id="notes-container"></div>
</body>
</html>
